# 是否开启模块 [true - 开启,false - 关闭]
# -----
#加入消息
JoinMessage:
  Enable: true
# 退出消息
QuitMessage:
  Enable: true
# 死亡消息(广播, 向全体玩家发送)
DeathBroadcast:
  Enable: true
# 死亡消息(私信, 向死亡玩家发送)
DeathMsg:
  Enable: true
# 自杀功能(/suicide)
Suicide:
  Enable: true
# 强制执行指令功能(/sudo)
Sudo:
  Enable: true
# 以控制台身份执行指令
Console:
  Enable: true