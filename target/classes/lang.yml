# 插件前缀
Prefix: "&b&lHNPlugin &f&7>&f"
# 没有权限时提示消息 [%prefix% - 插件前缀]
NoPermission: "%prefix% &c你没有权限!"
# 不能在控制台执行的指令提示
CantUseInConsole: "%prefix% &c你不能在控制台上执行这个指令!"
# 重载提示
ReloadMessage: "%prefix% &a插件已重载!"
# 加入提示 [可用变量符: %player% - 玩家名,%prefix% - 插件前缀]
JoinMessage: "&8[&a+&8] &7%player%"
# 退出提示 [可用变量符: %player% - 玩家名,%prefix% - 插件前缀]
QuitMessage: "&8[&c-&8] &7%player%"
# 公告的前缀 [可用变量符: %prefix% - 插件前缀]
BCPrefix: "%prefix% &b[公告] &f"
# 死亡消息(广播, 向全体玩家发送) [可用变量符: %player% - 玩家名,%prefix% - 插件前缀,%death_x% - 死亡的x轴,%death_y% - 死亡的y轴,%death_z% - 死亡的z轴,%death_world% - 死亡的世界]
DeathBroadcast: "%prefix% &e%player% 消逝了"
# 死亡消息(私信, 向死亡玩家发送) [可用变量符: %player% - 玩家名,%prefix% - 插件前缀,%death_x% - 死亡的x轴,%death_y% - 死亡的y轴,%death_z% - 死亡的z轴,%death_world% - 死亡的世界]
DeathMsg: "%prefix% &e你消逝了,死亡点在%death_world%, %death_x%, %death_y%, %death_z%"
# 自杀广播 [可用变量符: %player% - 玩家名,%prefix% - 插件前缀]
SuicideBroadcast:  "%prefix% &c%player% 自杀了..."
# 在执行人需要输入玩家名却写错时出现此消息 [可用变量符: %prefix% - 插件前缀]
WrongPlayer: "%prefix% &c未找到玩家"
# 强制执行指令(/sudo)执行成功提示 [可用变量符: %sudocmd% - 执行的指令,%sudoplayer% - 被强制执行指令的玩家,%prefix% - 插件前缀]
SudoFeedBack: "%prefix% &a你已使 &e%sudoplayer% &a强制执行 &e%sudocmd%"
# 以控制台身份执行指令反馈(/console) [可用变量符: %consolecmd% - 执行的指令,%prefix% - 插件前缀]
ConsoleCommandFeedBack: "%prefix% &a你以控制台身份执行了指令 &e%consolecmd%"
# Tpa请求发送 [可用变量符: %prefix% - 插件前缀,%target% - 目标玩家]
TpaRequestSent: "%prefix% &a已向 &e%target% &a发送传送请求"
# 收到TPA请求 [可用变量符: %prefix% - 插件前缀,%requester% - 请求者,%accept% - 接受按钮,%deny% - 拒绝按钮]
TpaRequestReceived: "%prefix% &e%requester% &a请求传送到你这里 %accept% %deny%"
# TPAHERE请求已发送 [可用变量符: %prefix% - 插件前缀,%target% - 目标玩家]
TpaHereRequestSent: "%prefix% &a已请求 &e%target% &a传送到你这里"
# 收到TPAHERE请求 [可用变量符: %prefix% - 插件前缀,%requester% - 请求者,%accept% - 接受按钮,%deny% - 拒绝按钮. 这2者对应TpaAcceptButton和TpaDenyButton]
TpaHereRequestReceived: "%prefix% &e%requester% &a请求你传送到他那里 %accept% %deny%"
# 接受按钮文本
TpaAcceptButton: "&a[接受]"
# 拒绝按钮文本
TpaDenyButton: "&c[拒绝]"
# 没有待处理请求 [可用变量符: %prefix% - 插件前缀]
TpaNoRequest: "%prefix% &c你没有待处理的传送请求"
# 不能向自己发送传送请求的消息 [可用变量符: %prefix% - 插件前缀]
TpaCantSelf: "%prefix% &c不能向自己发送传送请求"
# 用法错误 [可用变量符: %prefix% - 插件前缀,%cmd% - 命令名]
TpaUsage: "%prefix% &c用法: /%cmd% <玩家>"
# 控制台不能使用 [可用变量符: %prefix% - 插件前缀]
TpaCantUseInConsole: "%prefix% &c控制台不能使用此命令"
# 请求者处于离线状态 [可用变量符: %prefix% - 插件前缀,%requester% - 请求者]
TpaRequesterOffline: "%prefix% &c请求者 %requester% 已离线"
# 目标玩家已接受 [可用变量符: %prefix% - 插件前缀,%requester% - 请求者]
TpaAcceptedTarget: "%prefix% &a你已接受 &e%requester% &a的传送请求"
# 请求被目标接受 [可用变量符: %prefix% - 插件前缀,%target% - 目标玩家]
TpaAcceptedRequester: "%prefix% &e%target% &a已接受你的传送请求"
# 目标玩家已拒绝 [可用变量符: %prefix% - 插件前缀,%requester% - 请求者]
TpaDeniedTarget: "%prefix% &c你已拒绝 &e%requester% &c的传送请求"
# 请求被目标拒绝 [可用变量符: %prefix% - 插件前缀,%target% - 目标玩家]
TpaDeniedRequester: "%prefix% &c%target% &c已拒绝你的传送请求"
# 插件世界变量符显示文本 [你可以自己加世界，仿照这个格式即可]
WorldDisplayList:
  world: "&a主世界"
  world_nether: "&c地狱世界"
  world_the_end: "&6末地世界"